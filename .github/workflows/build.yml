name: Build & Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - module: app
            artifact_suffix: app
          - module: core
            artifact_suffix: core
          - module: features:backup
            artifact_suffix: features-backup
          - module: features:restore
            artifact_suffix: features-restore
          - module: features:transfer
            artifact_suffix: features-transfer
          - module: features:whatsapp
            artifact_suffix: features-whatsapp
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: >-
          platforms;android-34
          build-tools;34.0.0
    
    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    
    - name: Build ${{ matrix.module }}
      run: ./gradlew :${{ matrix.module }}:assembleDebug
    
    - name: Run Unit Tests
      run: ./gradlew test
    
    - name: Upload APK
      if: matrix.module == 'app'
      uses: actions/upload-artifact@v4
      with:
        name: phonebackuppro-debug-apk-${{ github.sha }}
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 14
    
    - name: Upload Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-results-${{ matrix.artifact_suffix }}
        path: |
          **/build/reports/tests/
          **/build/test-results/
